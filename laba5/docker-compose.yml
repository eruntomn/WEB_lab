services:
  api:
    build: .
    container_name: web-lab5
    ports:
      - "5000:5000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - DB_PATH=/app/data/app.db
      - LOG_LEVEL=INFO
      - BLOCKED_EMAIL_DOMAINS=tempmail.com,mailinator.com
      - ENABLE_DEBUG_ROUTES=1
    volumes:
      - db_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  db_data: