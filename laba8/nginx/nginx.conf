worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;   # не показывать версию Nginx
    sendfile on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Ограничение частоты запросов: общий API и отдельно вход (защита от подбора пароля)
    limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream backend {
        least_conn;
        server api1:5000;
        server api2:5000;
    }

    #HTTP: только редирект на HTTPS 
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;   # 8443 это порт HTTPS на хосте
    }

    #HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 1m;

        root  /var/www/static;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location / {
            try_files $uri $uri/ =404;
        }


        location ~* \.(css|js|svg|png|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /xss-vulnerable.html {
            add_header X-Demo "no CSP on purpose" always;
        }

        location = /xss-vulnerable-csp.html {
            alias /var/www/static/xss-vulnerable.html;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/snippets/proxy-headers.conf;
            include /etc/nginx/snippets/security-headers.conf;
            error_page 502 503 @api_bad_gateway;
            error_page 504 @api_timeout;
            proxy_pass http://backend/auth/login;
        }

        location ^~ /api/ {
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/snippets/proxy-headers.conf;
            include /etc/nginx/snippets/security-headers.conf;
            error_page 502 503 @api_bad_gateway;
            error_page 504 @api_timeout;
            proxy_pass http://backend/;
        }

        location @api_bad_gateway {
            default_type application/json;
            return 502 '{"error":"Bad gateway","message":"The application is unavailable","code":"BAD_GATEWAY"}';
        }

        location @api_timeout {
            default_type application/json;
            return 504 '{"error":"Gateway timeout","message":"The application did not respond in time","code":"GATEWAY_TIMEOUT"}';
        }
    }
}