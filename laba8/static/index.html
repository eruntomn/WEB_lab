<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lab 8: Nginx and security</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>Lab 8: Nginx + security</h1>

    <section id="login-box">
      <h2>Sign in</h2>
      <input id="email" type="email" placeholder="email" value="anna@example.com">
      <input id="password" type="password" placeholder="password">
      <button id="login-btn">Sign in</button>
    </section>

    <section id="profile-box" hidden>
      <h2>Welcome, <span id="user-name"></span> (<span id="user-role"></span>)</h2>
      <textarea id="bio" rows="3" maxlength="300" placeholder="About me"></textarea>
      <input id="city" placeholder="City">
      <button id="save-btn">Save profile</button>
      <button id="logout-btn">Sign out</button>
    </section>

    <pre id="output"></pre>
    <p>
      <a href="/xss-safe.html">XSS demo: safe page</a> |
      <a href="/xss-vulnerable.html">XSS demo: vulnerable page</a> |
      <a href="/xss-vulnerable-csp.html">XSS demo: vulnerable page + CSP</a>
    </p>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
