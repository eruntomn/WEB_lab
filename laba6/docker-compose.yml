services:
  api:
    build: .
    container_name: web-lab6
    command: sh -c "python migrate.py up && python run.py"
    ports:
      - "5000:5000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - DB_PATH=/app/data/app.db
      - MIGRATIONS_DIR=migrations
      - SESSION_TTL_SECONDS=3600
      - COOKIE_SECURE=0
      - LOG_LEVEL=INFO
    volumes:
      - db_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  db_data: